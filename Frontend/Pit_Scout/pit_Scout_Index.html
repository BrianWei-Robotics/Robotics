<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GalacTech 4926 | Pit Scouting</title>
    <link rel="stylesheet" href="pit_Scout_Style.css">
</head>
<body>

    <header>
        <h1><span class="highlight">Galac</span>Tech 4926</h1>
        <p class="subtitle">Pit Scouting Application</p>
    </header>

    <div class="stats-banner" id="statsBanner">
        Teams Scouted: 0
    </div>

    <form id="scoutForm">
        <div class="card">
            <h2>Team Information</h2>
            <div class="form-group">
                <label for="teamNumber">Team Number *</label>
                <input type="number" id="teamNumber" required placeholder="e.g., 254">
            </div>
            <div class="form-group">
                <label for="teamName">Team Name</label>
                <input type="text" id="teamName" placeholder="e.g., The Cheesy Poofs">
            </div>
            <div class="form-group">
                <label for="scoutName">Scout Name *</label>
                <input type="text" id="scoutName" required placeholder="Enter your name">
            </div>
        </div>

        <div class="card">
            <h2>Robot Specifications</h2>
            <div class="form-group">
                <label for="drivetrain">Drivetrain Type</label>
                <select id="drivetrain">
                    <option value="Swerve">Swerve</option>
                    <option value="Tank/West Coast">Tank / West Coast</option>
                    <option value="Mecanum">Mecanum</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="weight">Robot Weight (lbs)</label>
                <input type="number" id="weight" step="0.1" placeholder="e.g., 120">
            </div>
            <div class="form-group">
                <label for="dimensions">Dimensions (W x L in inches)</label>
                <input type="text" id="dimensions" placeholder="e.g., 28x28">
            </div>
        </div>

        <div class="card">
            <h2>Capabilities</h2>
            <div class="checkbox-group">
                <input type="checkbox" id="hasAuto">
                <label for="hasAuto">Has Autonomous Routine?</label>
            </div>
            <div class="form-group">
                <label for="autoNotes">Auto Path Notes</label>
                <input type="text" id="autoNotes" placeholder="e.g., 3 piece + balance">
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="canClimb">
                <label for="canClimb">Can Climb/Hang?</label>
            </div>
            <div class="form-group">
                <label for="scoringPref">Preferred Scoring Area</label>
                <select id="scoringPref">
                    <option value="Any">Any</option>
                    <option value="High">High Level</option>
                    <option value="Low">Low Level</option>
                    <option value="Defense">Defense/Feeder</option>
                </select>
            </div>
        </div>

        <div class="card">
            <h2>System Data & Notes</h2>
            <div class="form-group">
                <label for="notes">General Impressions / Weaknesses / Strengths</label>
                <textarea id="notes" placeholder="e.g., Very fast cycle times, but fragile intake..."></textarea>
            </div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn-save">Save Data to Local Node</button>
            <button type="button" id="exportBtn" class="btn-export">Export CSV Telemetry</button>
        </div>
    </form>

    <script src="pit_Scout_Script.js"></script>
</body>
</html>
